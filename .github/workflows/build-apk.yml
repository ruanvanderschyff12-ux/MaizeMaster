name: Build MaizeMaster APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: maizemaster-apk-signing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MAIZEMASTER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MAIZEMASTER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAIZEMASTER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MAIZEMASTER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::A required MaizeMaster signing secret is missing"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/maizemaster-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/maizemaster-signing/maizemaster-release.jks"
          chmod 600 "$RUNNER_TEMP/maizemaster-signing/maizemaster-release.jks"
          echo "MAIZEMASTER_KEYSTORE_PATH=$RUNNER_TEMP/maizemaster-signing/maizemaster-release.jks" >> "$GITHUB_ENV"
          echo "MAIZEMASTER_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MAIZEMASTER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MAIZEMASTER_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/maizemaster-signing/maizemaster-release.jks" -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Install final MaizeMaster launcher icons
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq MaizeMaster_final_icon_pack.zip 'app/src/main/res/mipmap-*/ic_launcher*.png'
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$density/ic_launcher.png"
            test -s "app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

      - name: Build permanently signed MaizeMaster APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Publish directly downloadable APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/MaizeMaster.apk"
          TAG="apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" "$RUNNER_TEMP/MaizeMaster.apk#MaizeMaster.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "MaizeMaster APK build ${{ github.run_number }}" \
            --notes "Direct APK download for Android. Install over the existing MaizeMaster app to retain your data. This is a testing build." \
            --prerelease

      - name: Upload MaizeMaster APK
        uses: actions/upload-artifact@v4
        with:
          name: MaizeMaster-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

# Update installation test: preserve permanent signing identity across builds.
