
name: Build MaizeMaster APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: maizemaster-apk-signing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Keep the same debug signing certificate across GitHub-hosted runners.
      # This is for development/test APKs only, not production releases.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: maizemaster-debug-signing-v1

      - name: Ensure debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep 'SHA256:'

      - name: Build MaizeMaster APK
        run: gradle assembleDebug --stacktrace

      - name: Upload MaizeMaster APK
        uses: actions/upload-artifact@v4
        with:
          name: MaizeMaster-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
